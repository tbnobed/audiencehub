[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audience-hub"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "sqlalchemy==2.0.40",
  "alembic==1.15.2", "psycopg[binary]==3.2.6",
  "pydantic-settings==2.8.1", "pydantic==2.11.3",
  "authlib==1.5.2", "itsdangerous==2.2.0",
  "cryptography==44.0.2", "phonenumbers==9.0.3", "email-validator==2.2.0",
  "Faker==37.1.0", "python-multipart==0.0.20",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]